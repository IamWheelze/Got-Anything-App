<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#grad)"/>

  <!-- Calendar Body -->
  <rect x="120" y="140" width="272" height="280" rx="24" fill="white" opacity="0.95"/>

  <!-- Calendar Header -->
  <rect x="120" y="140" width="272" height="70" rx="24" fill="#764ba2"/>
  <rect x="120" y="180" width="272" height="30" fill="#764ba2"/>

  <!-- Calendar Rings -->
  <rect x="165" y="120" width="20" height="50" rx="10" fill="white"/>
  <rect x="327" y="120" width="20" height="50" rx="10" fill="white"/>

  <!-- Calendar Grid Dots (fake events) -->
  <circle cx="170" cy="250" r="12" fill="#667eea"/>
  <circle cx="220" cy="250" r="12" fill="#667eea"/>
  <circle cx="270" cy="250" r="12" fill="#667eea"/>
  <circle cx="320" cy="250" r="12" fill="#667eea"/>

  <circle cx="170" cy="300" r="12" fill="#667eea"/>
  <circle cx="270" cy="300" r="12" fill="#667eea"/>
  <circle cx="320" cy="300" r="12" fill="#667eea"/>

  <circle cx="170" cy="350" r="12" fill="#667eea"/>
  <circle cx="220" cy="350" r="12" fill="#667eea"/>
  <circle cx="320" cy="350" r="12" fill="#667eea"/>

  <!-- Winking Emoji Face -->
  <circle cx="380" cy="380" r="60" fill="#FFC107"/>
  <circle cx="365" cy="370" r="5" fill="#333"/>
  <path d="M 390 365 Q 400 375 410 365" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 360 400 Q 380 410 400 400" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
